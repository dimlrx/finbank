spring.application.name=finbank

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finbank}
spring.datasource.username=${DB_USERNAME:finbank}
spring.datasource.password=${DB_PASSWORD:finbank}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.error.include-message=never
