services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: finbank
      POSTGRES_USER: finbank
      POSTGRES_PASSWORD: finbank
    ports:
      - "5432:5432"
    volumes:
      - finbank-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbank -d finbank"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finbank-postgres:
